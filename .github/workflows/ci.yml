name: EGSA Academy CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (lint syntax + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Back_End
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Back_End/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Syntax check all source files
        run: find src -name "*.js" -exec node --check {} \;
      - name: Verify app wiring (no live DB required)
        run: node -e "require('./src/app.js'); console.log('app.js loads OK')"
      - name: Run unit tests
        run: npm test

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Front_End
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Front_End/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
