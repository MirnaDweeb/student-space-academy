<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#05101f"/>
    </linearGradient>
    <linearGradient id="trace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#3a7bd5"/>
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Grid Lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Circuit traces -->
  <path d="M 100 250 L 250 250 L 300 200 L 450 200 L 500 250 L 700 250" fill="none" stroke="url(#trace)" stroke-width="4"/>
  <path d="M 150 150 L 280 150 L 330 200" fill="none" stroke="#d4b87c" stroke-width="2" stroke-dasharray="6,4"/>
  <path d="M 470 200 L 520 150 L 650 150" fill="none" stroke="#d4b87c" stroke-width="2" stroke-dasharray="6,4"/>
  <path d="M 250 350 L 350 350 L 400 300 L 550 300" fill="none" stroke="#00d2ff" stroke-width="3"/>

  <!-- Microcontroller Chip -->
  <rect x="330" y="160" width="140" height="140" rx="8" fill="url(#chip)" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Pins -->
  <g fill="#94a3b8">
    <rect x="345" y="145" width="8" height="15"/>
    <rect x="365" y="145" width="8" height="15"/>
    <rect x="385" y="145" width="8" height="15"/>
    <rect x="405" y="145" width="8" height="15"/>
    <rect x="425" y="145" width="8" height="15"/>
    <rect x="445" y="145" width="8" height="15"/>

    <rect x="345" y="300" width="8" height="15"/>
    <rect x="365" y="300" width="8" height="15"/>
    <rect x="385" y="300" width="8" height="15"/>
    <rect x="405" y="300" width="8" height="15"/>
    <rect x="425" y="300" width="8" height="15"/>
    <rect x="445" y="300" width="8" height="15"/>
  </g>

  <!-- Labels -->
  <text x="400" y="225" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">EGSA-FPGA-01</text>
  <text x="400" y="245" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">SPACE HARDENED</text>
  <circle cx="345" cy="175" r="4" fill="#38bdf8"/>

  <!-- Telemetry Badge -->
  <rect x="30" y="30" width="220" height="46" rx="6" fill="rgba(15,23,42,0.85)" stroke="rgba(255,255,255,0.1)"/>
  <text x="45" y="50" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="bold" letter-spacing="1">EGSA SPACE ACADEMY</text>
  <text x="45" y="66" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">CIRCUIT LAB 01 · ROUTING</text>
</svg>
